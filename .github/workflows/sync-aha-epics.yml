name: Sync to Aha Epics

# ── TESTING PHASE ────────────────────────────────────────────────────────────
# Currently scoped to hc-pc/epics only, posting into release GLCP17-R-1.
# After testing, un-comment additional paths and the full WORKSPACE_MAP below,
# and switch the endpoint back to the product-level URL.
# ─────────────────────────────────────────────────────────────────────────────
on:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - 'requirements/services-intake/hc-pc/epics/*.md'
      # After testing, re-enable broader paths:
      # - 'requirements/**/epics/*.md'
      # - 'requirements/**/prds/*.md'

jobs:
  create-aha-epics:
    # Only run on merged PRs, not just closed ones
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find added/modified epic files
        id: changed
        run: |
          CHANGED=$(git diff --name-only --diff-filter=AM \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            | grep -E '^requirements/services-intake/hc-pc/epics/.+\.md$' || true)
          # After testing, broaden the grep to:
          # | grep -E '^requirements/.+/(epics|prds)/.+\.md$' || true)
          echo "Found files:"
          echo "$CHANGED"
          {
            echo "files<<EOF"
            echo "$CHANGED"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Diagnose Aha API connectivity
        env:
          AHA_API_TOKEN: ${{ secrets.AHA_API_TOKEN }}
          AHA_DOMAIN: hpepm.aha.io
        run: |
          echo "── Token present? ──────────────────────────"
          if [ -z "$AHA_API_TOKEN" ]; then
            echo "❌ AHA_API_TOKEN secret is empty or not set!"
          else
            echo "✅ AHA_API_TOKEN is set (length: ${#AHA_API_TOKEN})"
          fi

          echo "── GET /api/v1/me ───────────────────────────"
          curl -s -o /tmp/aha_me.json -w "HTTP %{http_code}\n" \
            -H "Authorization: Bearer $AHA_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://${AHA_DOMAIN}/api/v1/me"
          cat /tmp/aha_me.json | jq '{email: .user.email, name: .user.name}' 2>/dev/null || cat /tmp/aha_me.json

          echo "── GET /api/v1/products (first 5) ──────────"
          curl -s -o /tmp/aha_products.json -w "HTTP %{http_code}\n" \
            -H "Authorization: Bearer $AHA_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://${AHA_DOMAIN}/api/v1/products?per_page=5"
          cat /tmp/aha_products.json | jq '[.products[]? | {reference_prefix, name, id}]' 2>/dev/null || cat /tmp/aha_products.json

      - name: Create Aha Epics via workspace map
        if: steps.changed.outputs.files != ''
        env:
          AHA_API_TOKEN: ${{ secrets.AHA_API_TOKEN }}
          AHA_DOMAIN: hpepm.aha.io
        run: |
          # ── Folder → Aha product prefix map ──────────────────────────────
          # Release is derived automatically as ${PREFIX}-R-1
          # (matching the "Parking lot" release in each workspace).
          # services-intake — active
          declare -A WORKSPACE_MAP
          WORKSPACE_MAP["hc-pc"]="GLCP17"
          # Uncomment below as additional workspace IDs are confirmed:
          # WORKSPACE_MAP["aruba"]="GLCPxx"
          # WORKSPACE_MAP["com-nonstop"]="GLCPxx"
          # WORKSPACE_MAP["compute-hpc-ai"]="GLCPxx"
          # WORKSPACE_MAP["flex"]="GLCPxx"
          # WORKSPACE_MAP["hc-dscc"]="GLCPxx"
          # WORKSPACE_MAP["hc-saas"]="GLCPxx"
          # WORKSPACE_MAP["hc-storage"]="GLCPxx"
          # WORKSPACE_MAP["ideas-portal"]="GLCPxx"
          # WORKSPACE_MAP["juniper-datacenter"]="GLCPxx"
          # WORKSPACE_MAP["opsramp"]="GLCPxx"
          # WORKSPACE_MAP["pointnext"]="GLCPxx"
          # capabilities
          # WORKSPACE_MAP["api-cli-framework"]="GLCP10"
          # WORKSPACE_MAP["commerce"]="GLCP2"
          # WORKSPACE_MAP["compliance-certification"]="GLCP4"
          # WORKSPACE_MAP["consumption-analytics"]="GLCP36"
          # WORKSPACE_MAP["consumption-data-services"]="GLCP37"
          # WORKSPACE_MAP["data-analytics"]="GLCP5"
          # WORKSPACE_MAP["device-subscription-management"]="GLCP45"
          # WORKSPACE_MAP["high-availability"]="GLCP11"
          # WORKSPACE_MAP["on-prem"]="GLCP8"
          # WORKSPACE_MAP["partner-management"]="GLCP7"
          # WORKSPACE_MAP["pi-initiatives"]="GLCP34"
          # WORKSPACE_MAP["platform-architecture"]="GLCP12"
          # WORKSPACE_MAP["security"]="GLCP9"
          # WORKSPACE_MAP["sustainability"]="GLCP35"
          # WORKSPACE_MAP["ui-ux-framework"]="GLCP3"
          # WORKSPACE_MAP["unified-support-experience"]="GLCP6"
          # WORKSPACE_MAP["user-account-management"]="GLCP1"
          # ─────────────────────────────────────────────────────────────────

          FAILED=0

          while IFS= read -r file; do
            [ -z "$file" ] && continue

            echo "──────────────────────────────────────────"
            echo "Processing: $file"

            # Derive folder name from path:
            # requirements / (capabilities|services-intake) / <folder> / epics / file.md
            FOLDER=$(echo "$file" | cut -d'/' -f3)
            WORKSPACE_ID="${WORKSPACE_MAP[$FOLDER]}"

            if [ -z "$WORKSPACE_ID" ]; then
              echo "⚠️  No workspace mapping for folder '$FOLDER' — skipping."
              echo "   Add WORKSPACE_MAP[\"$FOLDER\"]=\"GLCPxx\" to enable this folder."
              continue
            fi

            # Derive release reference as ${WORKSPACE_ID}-R-1 (Parking lot)
            # then resolve it to an internal ID via the Aha releases API,
            # because the epic create endpoint ignores reference_num and
            # defaults to the active release unless an internal ID is supplied.
            RELEASE_REF="${WORKSPACE_ID}-R-1"
            RELEASE_ID=$(curl -s \
              -H "Authorization: Bearer $AHA_API_TOKEN" \
              -H "Content-Type: application/json" \
              "https://${AHA_DOMAIN}/api/v1/products/${WORKSPACE_ID}/releases?per_page=50" \
              | jq -r --arg ref "$RELEASE_REF" \
                '.releases[] | select(.reference_num == $ref) | .id')

            if [ -z "$RELEASE_ID" ]; then
              echo "❌ Could not resolve release ID for $RELEASE_REF in $WORKSPACE_ID — skipping."
              FAILED=1
              continue
            fi

            # Parse H1 heading as the epic name; fall back to the filename
            EPIC_NAME=$(grep -m1 '^# ' "$file" | sed 's/^# //' | xargs)
            if [ -z "$EPIC_NAME" ]; then
              EPIC_NAME=$(basename "$file" .md)
            fi

            # Build description from everything after the H1 line (capped at 100 lines)
            EPIC_DESC=$(awk 'NR>1' "$file" | head -100)

            echo "  Workspace : $WORKSPACE_ID"
            echo "  Release   : $RELEASE_REF (id: $RELEASE_ID)"
            echo "  Epic name : $EPIC_NAME"

            PAYLOAD=$(jq -n \
              --arg name "$EPIC_NAME" \
              --arg desc "$EPIC_DESC" \
              --arg release_id "$RELEASE_ID" \
              '{
                epic: {
                  name: $name,
                  description: $desc,
                  release: {id: $release_id}
                }
              }')

            RESPONSE=$(curl -s -w "\n%{http_code}" \
              -X POST \
              -H "Authorization: Bearer $AHA_API_TOKEN" \
              -H "Content-Type: application/json" \
              "https://${AHA_DOMAIN}/api/v1/products/${WORKSPACE_ID}/epics" \
              -d "$PAYLOAD")

            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | head -n -1)

            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              EPIC_REF=$(echo "$BODY" | jq -r '.epic.reference_num // "unknown"')
              EPIC_URL=$(echo "$BODY" | jq -r '.epic.url // ""')
              echo "  ✅ Created epic $EPIC_REF → $EPIC_URL"
            else
              echo "  ❌ Failed (HTTP $HTTP_CODE): $BODY"
              FAILED=1
            fi

          done <<< "${{ steps.changed.outputs.files }}"

          exit $FAILED
