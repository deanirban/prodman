name: Sync to Aha Epics

# ── TESTING PHASE ────────────────────────────────────────────────────────────
# Currently scoped to hc-pc/epics only, posting into release GLCP17-R-1.
# After testing, un-comment additional paths and the full WORKSPACE_MAP below,
# and switch the endpoint back to the product-level URL.
# ─────────────────────────────────────────────────────────────────────────────
on:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      # services-intake
      - 'requirements/services-intake/hc-pc/epics/*.md'
      - 'requirements/services-intake/ideas-portal/epics/*.md'
      - 'requirements/services-intake/aruba/epics/*.md'
      - 'requirements/services-intake/compute-hpc-ai/epics/*.md'
      - 'requirements/services-intake/com-nonstop/epics/*.md'
      - 'requirements/services-intake/flex/epics/*.md'
      - 'requirements/services-intake/hc-dscc/epics/*.md'
      - 'requirements/services-intake/hc-storage/epics/*.md'
      - 'requirements/services-intake/juniper-datacenter/epics/*.md'
      - 'requirements/services-intake/opsramp/epics/*.md'
      - 'requirements/services-intake/pointnext/epics/*.md'
      # capabilities
      - 'requirements/capabilities/api-cli-framework/epics/*.md'
      - 'requirements/capabilities/commerce/epics/*.md'
      - 'requirements/capabilities/compliance-certification/epics/*.md'
      - 'requirements/capabilities/consumption-analytics/epics/*.md'
      - 'requirements/capabilities/consumption-data-services/epics/*.md'
      - 'requirements/capabilities/data-analytics/epics/*.md'
      - 'requirements/capabilities/device-subscription-management/epics/*.md'
      - 'requirements/capabilities/high-availability/epics/*.md'
      - 'requirements/capabilities/on-prem/epics/*.md'
      - 'requirements/capabilities/partner-management/epics/*.md'
      - 'requirements/capabilities/platform-architecture/epics/*.md'
      - 'requirements/capabilities/security/epics/*.md'
      - 'requirements/capabilities/sustainability/epics/*.md'
      - 'requirements/capabilities/ui-ux-framework/epics/*.md'
      - 'requirements/capabilities/unified-support-experience/epics/*.md'
      - 'requirements/capabilities/user-account-management/epics/*.md'

jobs:
  create-aha-epics:
    # Only run on merged PRs, not just closed ones
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find added/modified epic files
        id: changed
        run: |
          CHANGED=$(git diff --name-only --diff-filter=AM \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            | grep -E '^requirements/(services-intake/(hc-pc|ideas-portal|aruba|compute-hpc-ai|com-nonstop|flex|hc-dscc|hc-storage|juniper-datacenter|opsramp|pointnext)|capabilities/(api-cli-framework|commerce|compliance-certification|consumption-analytics|consumption-data-services|data-analytics|device-subscription-management|high-availability|on-prem|partner-management|platform-architecture|security|sustainability|ui-ux-framework|unified-support-experience|user-account-management))/epics/.+\.md$' || true)
          echo "Found files:"
          echo "$CHANGED"
          {
            echo "files<<EOF"
            echo "$CHANGED"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Diagnose Aha API connectivity
        env:
          AHA_API_TOKEN: ${{ secrets.AHA_API_TOKEN }}
          AHA_DOMAIN: hpepm.aha.io
        run: |
          echo "── Token present? ──────────────────────────"
          if [ -z "$AHA_API_TOKEN" ]; then
            echo " AHA_API_TOKEN secret is empty or not set!"
          else
            echo " AHA_API_TOKEN is set (length: ${#AHA_API_TOKEN})"
          fi

          echo "── GET /api/v1/me ───────────────────────────"
          curl -s -o /tmp/aha_me.json -w "HTTP %{http_code}\n" \
            -H "Authorization: Bearer $AHA_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://${AHA_DOMAIN}/api/v1/me"
          cat /tmp/aha_me.json | jq '{email: .user.email, name: .user.name}' 2>/dev/null || cat /tmp/aha_me.json

          echo "── GET /api/v1/products (first 5) ──────────"
          curl -s -o /tmp/aha_products.json -w "HTTP %{http_code}\n" \
            -H "Authorization: Bearer $AHA_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://${AHA_DOMAIN}/api/v1/products?per_page=5"
          cat /tmp/aha_products.json | jq '[.products[]? | {reference_prefix, name, id}]' 2>/dev/null || cat /tmp/aha_products.json

      - name: Create Aha Epics via workspace map
        if: steps.changed.outputs.files != ''
        env:
          AHA_API_TOKEN: ${{ secrets.AHA_API_TOKEN }}
          AHA_DOMAIN: hpepm.aha.io
        run: |
          # ── Folder → Aha product prefix ──────────────────────────────────
          # services-intake
          declare -A WORKSPACE_MAP
          WORKSPACE_MAP["hc-pc"]="GLCP17"            # HPE GreenLake for Private Cloud
          WORKSPACE_MAP["ideas-portal"]="GLCP13"     # Ideas Portal
          WORKSPACE_MAP["aruba"]="GLCP16"            # Aruba
          WORKSPACE_MAP["compute-hpc-ai"]="GLCP19"   # Compute / HPC / AI
          WORKSPACE_MAP["com-nonstop"]="GLCP50"      # NonStop
          WORKSPACE_MAP["flex"]="GLCP49"             # HPE Flex
          WORKSPACE_MAP["hc-dscc"]="GLCP47"          # Data Services Cloud Console
          WORKSPACE_MAP["hc-storage"]="GLCP18"       # HPE GreenLake for Storage
          WORKSPACE_MAP["juniper-datacenter"]="GLCP51" # Juniper Datacenter
          WORKSPACE_MAP["opsramp"]="GLCP32"          # OpsRamp
          WORKSPACE_MAP["pointnext"]="GLCP20"        # Pointnext
          # capabilities
          WORKSPACE_MAP["api-cli-framework"]="GLCP10"           # API / CLI Framework
          WORKSPACE_MAP["commerce"]="GLCP2"                     # Commerce
          WORKSPACE_MAP["compliance-certification"]="GLCP4"     # Compliance & Certification
          WORKSPACE_MAP["consumption-analytics"]="GLCP36"       # Consumption Analytics
          WORKSPACE_MAP["consumption-data-services"]="GLCP37"   # Consumption Data Services
          WORKSPACE_MAP["data-analytics"]="GLCP5"               # Data & Analytics
          WORKSPACE_MAP["device-subscription-management"]="GLCP45" # Device Subscription Management
          WORKSPACE_MAP["high-availability"]="GLCP11"           # High Availability
          WORKSPACE_MAP["on-prem"]="GLCP8"                      # On-Prem
          WORKSPACE_MAP["partner-management"]="GLCP7"           # Partner Management
          WORKSPACE_MAP["platform-architecture"]="GLCP12"       # Platform Architecture
          WORKSPACE_MAP["security"]="GLCP9"                     # Security
          WORKSPACE_MAP["sustainability"]="GLCP35"              # Sustainability
          WORKSPACE_MAP["ui-ux-framework"]="GLCP3"              # UI / UX Framework
          WORKSPACE_MAP["unified-support-experience"]="GLCP6"   # Unified Support Experience
          WORKSPACE_MAP["user-account-management"]="GLCP1"      # User & Account Management

          # ── Product prefix → Parking lot release internal ID ─────────────
          # Pre-fetched via GET /api/v1/products/{prefix}/releases
          # Note: juniper-datacenter uses R-2 (GLCP51-R-2), not R-1.
          declare -A RELEASE_ID_MAP
          RELEASE_ID_MAP["GLCP17"]="7128294929516075414"  # GLCP17-R-1 Parking lot  | HPE GreenLake for Private Cloud
          RELEASE_ID_MAP["GLCP13"]="7128294620924146608"  # GLCP13-R-1 Parking lot  | Ideas Portal
          RELEASE_ID_MAP["GLCP16"]="7128294859224684943"  # GLCP16-R-1 Parking lot  | Aruba
          RELEASE_ID_MAP["GLCP19"]="7128295090384476396"  # GLCP19-R-1 Parking lot  | Compute / HPC / AI
          RELEASE_ID_MAP["GLCP50"]="7610829864526230575"  # GLCP50-R-1 Parking lot  | NonStop
          RELEASE_ID_MAP["GLCP49"]="7610829709079121187"  # GLCP49-R-1 Parking lot  | HPE Flex
          RELEASE_ID_MAP["GLCP47"]="7353168634253183132"  # GLCP47-R-1 Parking lot  | Data Services Cloud Console
          RELEASE_ID_MAP["GLCP18"]="7128295035706620403"  # GLCP18-R-1 Parking lot  | HPE GreenLake for Storage
          RELEASE_ID_MAP["GLCP51"]="7614167401223301351"  # GLCP51-R-2 Parking lot  | Juniper Datacenter
          RELEASE_ID_MAP["GLCP32"]="7128296802538292352"  # GLCP32-R-1 Parking lot  | OpsRamp
          RELEASE_ID_MAP["GLCP20"]="7128295882547093549"  # GLCP20-R-1 Parking lot  | Pointnext
          # capabilities
          RELEASE_ID_MAP["GLCP1"]="7150872229332356984"    # GLCP1-R-1  Parking lot  | User & Account Management
          RELEASE_ID_MAP["GLCP2"]="7128293701299502134"    # GLCP2-R-1  Parking lot  | Commerce
          RELEASE_ID_MAP["GLCP3"]="7128293761680554161"    # GLCP3-R-1  Parking lot  | UI / UX Framework
          RELEASE_ID_MAP["GLCP4"]="7128293823183432847"    # GLCP4-R-1  Parking lot  | Compliance & Certification
          RELEASE_ID_MAP["GLCP5"]="7128293885951377665"    # GLCP5-R-1  Parking lot  | Data & Analytics
          RELEASE_ID_MAP["GLCP6"]="7128293987621272937"    # GLCP6-R-1  Parking lot  | Unified Support Experience
          RELEASE_ID_MAP["GLCP7"]="7128294080129928601"    # GLCP7-R-1  Parking lot  | Partner Management
          RELEASE_ID_MAP["GLCP8"]="7128294176896902250"    # GLCP8-R-1  Parking lot  | On-Prem
          RELEASE_ID_MAP["GLCP9"]="7128294327839961911"    # GLCP9-R-1  Parking lot  | Security
          RELEASE_ID_MAP["GLCP10"]="7128294396392024897"   # GLCP10-R-1 Parking lot  | API / CLI Framework
          RELEASE_ID_MAP["GLCP11"]="7128294485639007067"   # GLCP11-R-1 Parking lot  | High Availability
          RELEASE_ID_MAP["GLCP12"]="7128294548305709587"   # GLCP12-R-1 Parking lot  | Platform Architecture
          RELEASE_ID_MAP["GLCP35"]="7129738553705712644"   # GLCP35-R-1 Parking lot  | Sustainability
          RELEASE_ID_MAP["GLCP36"]="7129738625802355025"   # GLCP36-R-1 Parking lot  | Consumption Analytics
          RELEASE_ID_MAP["GLCP37"]="7129738701409316920"   # GLCP37-R-1 Parking lot  | Consumption Data Services
          RELEASE_ID_MAP["GLCP45"]="7129836891028171763"   # GLCP45-R-1 Parking lot  | Device Subscription Management
          # ─────────────────────────────────────────────────────────────────

          FAILED=0

          while IFS= read -r file; do
            [ -z "$file" ] && continue

            echo "──────────────────────────────────────────"
            echo "Processing: $file"

            # Derive folder name from path:
            # requirements / (capabilities|services-intake) / <folder> / epics / file.md
            FOLDER=$(echo "$file" | cut -d'/' -f3)
            WORKSPACE_ID="${WORKSPACE_MAP[$FOLDER]}"

            if [ -z "$WORKSPACE_ID" ]; then
              echo "  No workspace mapping for folder '$FOLDER' — skipping."
              echo "   Add WORKSPACE_MAP[\"$FOLDER\"]=\"GLCPxx\" to enable this folder."
              continue
            fi

            RELEASE_ID="${RELEASE_ID_MAP[$WORKSPACE_ID]}"
            RELEASE_REF="${WORKSPACE_ID}-R-1"

            if [ -z "$RELEASE_ID" ]; then
              echo " No release ID for $WORKSPACE_ID in RELEASE_ID_MAP — skipping."
              FAILED=1
              continue
            fi

            # Parse H1 heading as the epic name; fall back to the filename
            EPIC_NAME=$(grep -m1 '^# ' "$file" | sed 's/^# //' | xargs)
            if [ -z "$EPIC_NAME" ]; then
              EPIC_NAME=$(basename "$file" .md)
            fi

            # Build description from everything after the H1 line (capped at 100 lines)
            EPIC_DESC=$(awk 'NR>1' "$file" | head -100)

            echo "  Workspace : $WORKSPACE_ID"
            echo "  Release   : $RELEASE_REF (id: $RELEASE_ID)"
            echo "  Epic name : $EPIC_NAME"

            PAYLOAD=$(jq -n \
              --arg name "$EPIC_NAME" \
              --arg desc "$EPIC_DESC" \
              --arg release_id "$RELEASE_ID" \
              '{
                epic: {
                  name: $name,
                  description: $desc,
                  release_id: $release_id
                }
              }')

            RESPONSE=$(curl -s -w "\n%{http_code}" \
              -X POST \
              -H "Authorization: Bearer $AHA_API_TOKEN" \
              -H "Content-Type: application/json" \
              "https://${AHA_DOMAIN}/api/v1/products/${WORKSPACE_ID}/epics" \
              -d "$PAYLOAD")

            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | head -n -1)

            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              EPIC_REF=$(echo "$BODY" | jq -r '.epic.reference_num // "unknown"')
              EPIC_URL=$(echo "$BODY" | jq -r '.epic.url // ""')
              echo "   Created epic $EPIC_REF → $EPIC_URL"
            else
              echo "   Failed (HTTP $HTTP_CODE): $BODY"
              FAILED=1
            fi

          done <<< "${{ steps.changed.outputs.files }}"

          exit $FAILED
